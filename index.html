<!doctype html><html lang="vi"><head><meta charset="utf-8"/>
<title>Fireworks to Heart</title><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}
</style></head><body><canvas id="cv"></canvas>
<script>
const c=document.getElementById('cv'), g=c.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2);
function R(){c.width=innerWidth*DPR;c.height=innerHeight*DPR;g.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',R);R();

function heart(t){return [16*Math.sin(t)**3,13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]}
const cx=()=>innerWidth/2, cy=()=>innerHeight/2, S=()=>Math.min(innerWidth,innerHeight)/34;

class P{constructor(x,y,dx,dy,h){this.x=x;this.y=y;this.dx=dx;this.dy=dy;this.h=h;this.age=0;this.phase='out'}}
function burst(){
  const x=cx()+(Math.random()-.5)*100, y=cy()+(Math.random()-.5)*80, h=Math.floor(Math.random()*360);
  for(let i=0;i<200;i++){
    const a=Math.random()*6.283, v=80+Math.random()*140;
    ps.push(new P(x,y,Math.cos(a)*v,Math.sin(a)*v,h));
  }
}
function toHeart(p){
  const t=Math.random()*6.283, [hx,hy]=heart(t), s=S();
  return {x:cx()+hx*s, y:cy()-hy*s};
}
let ps=[]; burst(); let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.032,(now-last)/1000); last=now;
  g.fillStyle="rgba(0,0,0,.25)"; g.fillRect(0,0,innerWidth,innerHeight);

  if(ps.length<50) burst();

  ps.forEach(p=>{
    if(p.phase==='out'){
      p.dx*=0.985; p.dy*=0.985;
      p.x+=p.dx*dt; p.y+=p.dy*dt;
      p.age+=dt;
      if(p.age>0.6){ p.phase='in'; const t=toHeart(p); p.tx=t.x; p.ty=t.y; }
    }else{
      p.x += (p.tx-p.x)*dt*1.8;
      p.y += (p.ty-p.y)*dt*1.8;
    }
    const grd=g.createRadialGradient(p.x,p.y,0,p.x,p.y,6);
    grd.addColorStop(0,`hsla(${p.h} 100% 60% / .9)`); grd.addColorStop(1,'transparent');
    g.fillStyle=grd; g.beginPath(); g.arc(p.x,p.y,6,0,6.283); g.fill();
  });
  ps = ps.filter(p=>!(p.phase==='in' && Math.hypot(p.x-p.tx,p.y-p.ty)<1));
}
loop(performance.now());
</script></body></html>
