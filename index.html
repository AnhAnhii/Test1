<!doctype html><html lang="vi"><head><meta charset="utf-8"/>
<title>Orbit Dots Heart</title><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}
</style></head><body><canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
function RS(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',RS);RS();

function heart(t){return [16*Math.sin(t)**3,13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]}
const N=220, pts=[...Array(N)].map((_,i)=>({t: i/N*2*Math.PI, sp: 0.006+Math.random()*0.004, hue: 280+i*0.6}));
function draw(){
  requestAnimationFrame(draw);
  const w=innerWidth,h=innerHeight,cx=w/2,cy=h/2, s=Math.min(w,h)/32;
  ctx.fillStyle="rgba(0,0,0,0.2)"; ctx.fillRect(0,0,w,h);
  pts.forEach(p=>{
    p.t=(p.t+p.sp)%(Math.PI*2);
    let [x,y]=heart(p.t); x=cx+x*s; y=cy-y*s;
    const r=2.2;
    const g=ctx.createRadialGradient(x,y,0,x,y,r*5);
    g.addColorStop(0,`hsla(${p.hue} 100% 70% / .9)`); g.addColorStop(1,`hsla(${p.hue} 100% 50% / 0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*5,0,6.283); ctx.fill();
    ctx.fillStyle=`hsl(${p.hue} 100% 65%)`; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
  });
}
draw();
</script></body></html>
