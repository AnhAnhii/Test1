<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>3D Heart Vortex + "I LOVE YOU" overlay (VI + Heart Points)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}

  /* ===== Panel điều khiển (Việt hoá) ===== */
  #ui{
    position:fixed;left:12px;top:12px;z-index:9;
    background:rgba(20,20,20,.55);border:1px solid #2a2a2a;border-radius:10px;
    padding:10px;color:#ddd;font:12px/1.2 system-ui,Arial;min-width:280px
  }
  #ui .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  #ui input[type=range]{flex:1}
  #ui label{cursor:pointer}

  /* ===== Overlay LOVE (đặt trên cùng) ===== */
  #love-wrap{
    position:fixed;inset:0 auto auto 0;
    width:100%;pointer-events:none;
    z-index:20;display:flex;justify-content:center;align-items:flex-start;
    padding-top:10px;
  }
  .love-container{width:min(500px,92vw);height:auto;aspect-ratio:500/200;position:relative}
  .love-svg{position:absolute;inset:0;z-index:2}
  .love-mo{width:100%;height:100%}

  .love-line{fill:none;stroke:#ffffff;stroke-width:8;stroke-linecap:round;stroke-miterlimit:10}
  .love-letter{fill:#f2a9ff}
</style>
</head>
<body>
<!-- ===== Panel điều khiển ===== -->
<div id="ui">
  <div><b>3D Trái tim Vortex</b></div>
  <div class="row"><span style="width:120px">Cường độ gió</span> <input id="strength" type="range" min="0.6" max="2.0" step="0.05" value="1.0"></div>
  <div class="row"><span style="width:120px">Kích thước tim</span> <input id="hsize" type="range" min="1.6" max="4.0" step="0.1" value="2.6"></div>
  <div class="row"><span style="width:120px">Giữ hình (giây)</span> <input id="hold" type="range" min="1" max="8" step="0.5" value="3.5"></div>
  <div class="row"><span style="width:120px">% viền tim</span> <input id="edge" type="range" min="0" max="80" step="5" value="40"></div>

  <div class="row"><span style="width:120px">Hình hạt</span>
    <label><input type="radio" name="shape" value="heart" checked> Trái tim</label>
    <label><input type="radio" name="shape" value="circle"> Hình tròn</label>
  </div>

  <div class="row">
    <span style="width:120px">Hạt bám tim</span>
    <input id="hpoints" type="range" min="400" max="7000" step="100" value="2600">
    <span style="margin-left:6px" id="hpval">2,600</span>
  </div>

  <div class="row">
    <span style="width:120px">Tổng hạt</span>
    <span id="pcnt" style="font-variant-numeric:tabular-nums"></span>
  </div>
</div>

<!-- ===== Overlay LOVE (đặt trên cùng màn hình) ===== -->
<div id="love-wrap">
  <div class="love-container">
    <svg class="love-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" aria-hidden="true">
      <line class="love-line love-line--left" x1="10" y1="17" x2="10" y2="183"></line>
      <line class="love-line love-line--rght" x1="490" y1="17" x2="490" y2="183"></line>
      <g>
        <path class="love-letter love-letter--I" d="M42.2,73.9h11.4v52.1H42.2V73.9z"></path>
        <path class="love-letter love-letter--L" d="M85.1,73.9h11.4v42.1h22.8v10H85.1V73.9z"></path>
        <path class="love-letter love-letter--O" d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100zM166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"></path>
        <path class="love-letter love-letter--V" d="M180.7,73.9H193l8.4,22.9c1.7,4.7,3.5,9.5,5,14.2h0.1c1.7-4.8,3.4-9.4,5.2-14.3l8.6-22.8h11.7l-19.9,52.1h-11.5L180.7,73.9z"></path>
        <path class="love-letter love-letter--E" d="M239.1,73.9h32.2v10h-20.7v10.2h17.9v9.5h-17.9v12.4H272v10h-33V73.9z"></path>
        <path class="love-letter love-letter--Y" d="M315.8,102.5l-20.1-28.6H309l6.3,9.4c2,3,4.2,6.4,6.3,9.6h0.1c2-3.2,4.1-6.4,6.3-9.6l6.3-9.4h12.9l-19.9,28.5v23.6h-11.4V102.5z"></path>
        <path class="love-letter love-letter--O2" d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"></path>
        <path class="love-letter love-letter--U" d="M412.4,101.1V73.9h11.4v26.7c0,10.9,2.4,15.9,11.5,15.9c8.4,0,11.4-4.6,11.4-15.8V73.9h11v26.9c0,7.8-1.1,13.5-4,17.7c-3.7,5.3-10.4,8.4-18.7,8.4c-8.4,0-15.1-3.1-18.8-8.5C413.4,114.2,412.4,108.5,412.4,101.1z"></path>
      </g>
    </svg>
    <div class="love-mo"></div>
  </div>
</div>

<!-- ===== Three.js ===== -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<!-- ===== mo.js cho hiệu ứng chữ ===== -->
<script src="https://cdn.jsdelivr.net/mojs/latest/mo.min.js"></script>

<script>
/* =========================
   PHẦN 1: Three.js vortex
   ========================= */
let SPRITE_SHAPE = 'heart';
const TOTAL = 3600;                              // tổng số hạt (giữ cố định)
let HEART_POINT_COUNT = 2600;                    // số hạt bám hình tim (có slider)
let HEART_SCALE = 2.6;
const HEART_YOFFSET = 38;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 30, 160);
scene.add(new THREE.AmbientLight(0xffffff, 1));

function makeCircle(size=64){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); const r=size/2;
  const g=ctx.createRadialGradient(r,r,0,r,r,r);
  g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(r,r,r,0,6.283); ctx.fill();
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; return tex;
}
function makeHeart(size=64){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); ctx.translate(size/2,size/2); ctx.scale(size/40,size/40);
  ctx.fillStyle='#fff'; ctx.beginPath();
  for(let t=-Math.PI;t<=Math.PI;t+=0.02){
    const x=16*Math.sin(t)**3;
    const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    t===-Math.PI?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill();
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; return tex;
}
let spriteTex = makeHeart();

const rand=(a,b)=>a+Math.random()*(b-a);
function heartXY(t){ return [16*Math.sin(t)**3, 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]; }
function buildHeartTargets(count, scale=HEART_SCALE, yOffset=HEART_YOFFSET, edgePercent=40){
  const pts=[]; const nEdge = Math.floor(count * edgePercent / 100); const nFill = count - nEdge;
  for(let i=0;i<nEdge;i++){
    const t = -Math.PI + (i/nEdge)*Math.PI*2;
    const [hx,hy] = heartXY(t);
    pts.push(new THREE.Vector3(hx*scale + rand(-0.4,0.4), (+hy*scale + yOffset) + rand(-0.4,0.4), rand(-3,3)));
  }
  for(let i=0;i<nFill;i++){
    const t = rand(-Math.PI, Math.PI);
    const s = Math.pow(Math.random(), 0.35);
    const [hx,hy] = heartXY(t);
    pts.push(new THREE.Vector3(hx*s*scale + rand(-0.6,0.6), (+hy*s*scale + yOffset) + rand(-0.6,0.6), rand(-4,4)));
  }
  return pts;
}
let heartTargets = buildHeartTargets(HEART_POINT_COUNT);

document.getElementById('pcnt').textContent = TOTAL.toLocaleString();

const positions = new Float32Array(TOTAL*3);
const colors    = new Float32Array(TOTAL*3);
const state = new Array(TOTAL);
const vel   = new Array(TOTAL);
const targetIndex = new Array(TOTAL);
const boundAge = new Float32Array(TOTAL);
const boundMin = new Float32Array(TOTAL);

const blue = new THREE.Color('#66ccff');
const gold = new THREE.Color('#ffd34d');
const red  = new THREE.Color('#ff3a6a');

const bottomY=-40, floorY=-55, vortexY=-10, radiusX=90, radiusZ=80;
const gravity=-25, swirlBase=1.65, updraft=30;

for(let i=0;i<TOTAL;i++){
  const x=rand(-radiusX,radiusX), y=rand(floorY,bottomY), z=rand(-radiusZ,radiusZ);
  positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
  const c=Math.random()<0.6?blue:gold;
  colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  state[i]='float'; vel[i]=new THREE.Vector3(rand(-5,5),rand(5,15),rand(-5,5)); targetIndex[i]=-1;
  boundAge[i]=0; boundMin[i]=0;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors,3));

const material = new THREE.PointsMaterial({
  size: 12, sizeAttenuation:true,
  map: spriteTex, alphaTest:0.1, transparent:true, opacity:1,
  vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false
});
const points = new THREE.Points(geo, material);
scene.add(points);

function vortexField(x,y,z,strength=1){
  const dx=x, dy=y-vortexY, dz=z;
  const r=Math.max(5, Math.hypot(dx,dz));
  const fall=Math.exp(-(r*r)/9000);
  const tx=(dz/r), tz=-(dx/r);
  const swirl=swirlBase*strength*fall;
  const pull=-0.55*strength*fall;
  const lift=updraft*strength*(0.6+0.4*Math.exp(-(dy*dy)/400));
  return {
    vx: tx*swirl + (dx/r)*pull + (Math.random()-0.5)*0.08,
    vy: 0.35*swirl + lift*0.02 + (Math.random()-0.5)*0.06,
    vz: tz*swirl + (dz/r)*pull + (Math.random()-0.5)*0.08
  };
}

let tPrev=performance.now(), phase=0;
const strengthEl=document.getElementById('strength');
const sizeEl=document.getElementById('hsize');
const holdEl=document.getElementById('hold');
const edgeEl=document.getElementById('edge');
const hpointsEl=document.getElementById('hpoints');
const hpvalEl=document.getElementById('hpval');

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.04,(now-tPrev)/1000); tPrev=now;

  camera.position.x = Math.sin(now*0.00025)*30;
  camera.position.z = 160 + Math.cos(now*0.00025)*15;
  camera.lookAt(0,HEART_YOFFSET,0);

  const period=6.8; phase=(phase+dt/period)%1;
  const pulse=0.8 + 0.5*Math.sin(phase*6.283);
  const strength=parseFloat(strengthEl.value)*pulse;

  for(let i=0;i<TOTAL;i++){
    let x=positions[i*3], y=positions[i*3+1], z=positions[i*3+2];

    if(state[i]==='float'){
      const f=vortexField(x,y,z,strength*0.6);
      vel[i].x+=f.vx; vel[i].y+=gravity*0.02+f.vy; vel[i].z+=f.vz;
      vel[i].multiplyScalar(0.986);
      x+=vel[i].x*dt; y+=vel[i].y*dt; z+=vel[i].z*dt;
      if(y>0 && Math.random()<0.03) state[i]='rise';

    }else if(state[i]==='rise'){
      const f=vortexField(x,y,z,strength*1.35);
      vel[i].x+=f.vx; vel[i].y+=f.vy+0.7; vel[i].z+=f.vz;
      vel[i].multiplyScalar(0.986);
      x+=vel[i].x*dt*1.45; y+=vel[i].y*dt*1.45; z+=vel[i].z*dt*1.45;
      if(y>HEART_YOFFSET-6){
        state[i]='bound';
        targetIndex[i]=(Math.random()*heartTargets.length)|0;
        colors[i*3]=red.r; colors[i*3+1]=red.g; colors[i*3+2]=red.b;
        boundAge[i]=0;
        boundMin[i]=parseFloat(holdEl.value) + Math.random()*0.7;
      }

    }else{
      boundAge[i]+=dt;
      const t=heartTargets[targetIndex[i]], k=4.2, damp=0.90;
      vel[i].x+=(t.x-x)*k*dt; vel[i].y+=(t.y-y)*k*dt; vel[i].z+=(t.z-z)*k*dt;
      const f=vortexField(x,y,z,strength*0.18);
      vel[i].x+=f.vx*0.25; vel[i].y+=f.vy*0.12; vel[i].z+=f.vz*0.25;
      vel[i].multiplyScalar(damp);
      x+=vel[i].x*dt; y+=vel[i].y*dt; z+=vel[i].z*dt;

      if(boundAge[i] > boundMin[i] && phase>0.82 && Math.random()<0.015){
        state[i]='float'; targetIndex[i]=-1;
        const cc=Math.random()<0.6?blue:gold;
        colors[i*3]=cc.r; colors[i*3+1]=cc.g; colors[i*3+2]=cc.b;
        x=rand(-radiusX,radiusX); y=rand(floorY,bottomY); z=rand(-radiusZ,radiusZ);
        vel[i].set(rand(-5,5),rand(5,15),rand(-5,5));
      }
    }

    if(y<floorY-20 || Math.abs(x)>220 || Math.abs(z)>220){
      state[i]='float'; targetIndex[i]=-1;
      const cc=Math.random()<0.6?blue:gold;
      colors[i*3]=cc.r; colors[i*3+1]=cc.g; colors[i*3+2]=cc.b;
      x=rand(-radiusX,radiusX); y=rand(floorY,bottomY); z=rand(-radiusZ,radiusZ);
      vel[i].set(rand(-5,5),rand(5,15),rand(-5,5));
    }
    positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;

  // kích thước sprite theo Heart size
  points.material.size = 10 + (HEART_SCALE-2.4)*2;

  renderer.render(scene, camera);
}

/* ===== UI events ===== */
document.querySelectorAll('input[name="shape"]').forEach(r=>{
  r.onchange=()=>{
    SPRITE_SHAPE=r.value;
    spriteTex=(SPRITE_SHAPE==='heart')?makeHeart():makeCircle();
    points.material.map=spriteTex; points.material.needsUpdate=true;
  };
});
sizeEl.oninput=()=>{
  HEART_SCALE=parseFloat(sizeEl.value);
  heartTargets = buildHeartTargets(HEART_POINT_COUNT, HEART_SCALE, HEART_YOFFSET, parseFloat(edgeEl.value));
};
edgeEl.oninput=()=>{
  heartTargets = buildHeartTargets(HEART_POINT_COUNT, HEART_SCALE, HEART_YOFFSET, parseFloat(edgeEl.value));
};
hpointsEl.oninput=()=>{
  // Đảm bảo không vượt quá TOTAL và không quá thấp
  HEART_POINT_COUNT = Math.max(100, Math.min(TOTAL-100, parseInt(hpointsEl.value,10) || 0));
  hpvalEl.textContent = HEART_POINT_COUNT.toLocaleString();
  heartTargets = buildHeartTargets(HEART_POINT_COUNT, HEART_SCALE, HEART_YOFFSET, parseFloat(edgeEl.value));
};

requestAnimationFrame(animate);
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});
</script>

<script>
/* =========================
   PHẦN 2: mo.js "I LOVE YOU" (không sound)
   ========================= */
(function(){
  const qs = (sel,root=document) => root.querySelector(sel);
  const root = qs('#love-wrap');
  const el = {
    container: qs('.love-mo', root),
    i: qs('.love-letter--I', root),
    l: qs('.love-letter--L', root),
    o: qs('.love-letter--O', root),
    v: qs('.love-letter--V', root),
    e: qs('.love-letter--E', root),
    y: qs('.love-letter--Y', root),
    o2: qs('.love-letter--O2', root),
    u: qs('.love-letter--U', root),
    lineLeft:  qs('.love-line--left', root),
    lineRight: qs('.love-line--rght', root),
    colTxt: "#f2a9ff",
    colHeart: "#fa4843"
  };

  class Heart extends mojs.CustomShape {
    getShape(){return '<path d="M50,88.9C25.5,78.2,0.5,54.4,3.8,31.1S41.3,1.8,50,29.9c8.7-28.2,42.8-22.2,46.2,1.2S74.5,78.2,50,88.9z"/>'; }
    getLength(){return 200;}
  }
  mojs.addShape('heart', Heart);

  const crtBoom = (delay=0, x=0, rd=46) => {
    const parent = el.container;
    const crcl = new mojs.Shape({
      shape:'circle', fill:'none', stroke:el.colTxt, strokeWidth:{5:0},
      radius:{[rd]:[rd+20]}, easing:'quint.out', duration:500/3, parent, delay, x
    });
    const brst = new mojs.Burst({
      radius:{[rd+15]:110}, angle:'rand(60,180)', count:3, timeline:{delay}, parent, x,
      children:{ radius:[5,3,7], fill:el.colTxt, scale:{1:0, easing:'quad.in'},
        pathScale:[.8,null], degreeShift:['rand(13,60)',null], duration:1000/3, easing:'quint.out'}
    });
    return [crcl, brst];
  };

  const move=1000, boom=200, easing='sin.inOut', easingBoom='sin.in', easingOut='sin.out';
  const opts={ duration:move, easing, opacity:1 }, delta=150;

  const tl = new mojs.Timeline().add([
    new mojs.Tween({
      duration: move,
      onStart: ()=>[el.i,el.l,el.o,el.v,el.e,el.y,el.o2,el.u].forEach(n=>{ n.style.opacity=1; n.style.transform='translate(0,0)'; }),
      onComplete: ()=>[el.l,el.o,el.v,el.e].forEach(n=> n.style.opacity=0)
    }),
    new mojs.Tween({
      duration: move*2 + boom,
      onComplete: ()=>[el.y,el.o2].forEach(n=> n.style.opacity=0)
    }),
    new mojs.Tween({
      duration: move*3 + boom*2 - delta,
      onComplete: ()=>{ el.i.style.opacity=0; }
    }),
    new mojs.Tween({
      duration: move*3 + boom*2,
      onComplete: ()=>{ el.u.style.opacity=0; }
    }),
    new mojs.Tween({
      duration:50, delay:4050,
      onUpdate:(p)=>[el.i,el.l,el.o,el.v,el.e,el.y,el.o2,el.u].forEach(n=> n.style.opacity=p),
      onComplete: ()=>[el.i,el.l,el.o,el.v,el.e,el.y,el.o2,el.u].forEach(n=>{ n.style.opacity=1; n.style.transform='translate(0,0)'; })
    }),

    new mojs.Html({...opts, el:el.lineLeft,  x:{0:52}})
      .then({duration:boom+move, easing, x:{to:52+54}})
      .then({duration:boom+move, easing, x:{to:52+54+60}})
      .then({duration:150, easing, x:{to:52+54+60+10}})
      .then({duration:300})
      .then({duration:350, x:{to:0}, easing:easingOut}),

    new mojs.Html({...opts, el:el.lineRight, x:{0:-52}})
      .then({duration:boom+move, easing, x:{to:-52-54}})
      .then({duration:boom+move, easing, x:{to:-52-54-60}})
      .then({duration:150, easing, x:{to:-52-54-60-10}})
      .then({duration:300})
      .then({duration:350, x:{to:0}, easing:easingOut}),

    new mojs.Html({...opts, el:el.i,  x:{0:34}})
      .then({duration:boom, easing:easingBoom, x:{to:34+19}})
      .then({duration:move, easing, x:{to:34+19+40}})
      .then({duration:boom, easing:easingBoom, x:{to:34+19+40+30}})
      .then({duration:move, easing, x:{to:34+19+40+30+30}}),

    new mojs.Html({...opts, el:el.l,  x:{0:15}}),
    new mojs.Html({...opts, el:el.o,  x:{0:11}}),
    new mojs.Html({...opts, el:el.v,  x:{0:3}}),
    new mojs.Html({...opts, el:el.e,  x:{0:-3}}),

    new mojs.Html({...opts, el:el.y,  x:{0:-20}})
      .then({duration:boom, easing:easingBoom, x:{to:-20-33}})
      .then({duration:move, easing, x:{to:-20-33-24}}),

    new mojs.Html({...opts, el:el.o2, x:{0:-27}})
      .then({duration:boom, easing:easingBoom, x:{to:-27-27}})
      .then({duration:move, easing, x:{to:-27-27-30}}),

    new mojs.Html({...opts, el:el.u,  x:{0:-32}})
      .then({duration:boom, easing:easingBoom, x:{to:-32-21}})
      .then({duration:move, easing, x:{to:-32-21-36}})
      .then({duration:boom, easing:eensingBoom, x:{to:-32-21-36-31}})
      .then({duration:move, easing, x:{to:-32-21-36-31-27}}),

    new mojs.Shape({
      parent: el.container, shape:'heart', delay:move, fill:el.colHeart,
      x:-64, scale:{0:0.95, easing: mojs.easing.path('M0,100C2.9,86.7,33.6-7.3,46-7.3s15.2,22.7,26,22.7S89,0,100,0')},
      duration:500
    })
      .then({ x:{to:-62, easing:'sin.inOut'}, scale:{to:0.65, easing:'sin.inOut'}, duration:boom+move-500 })
      .then({ duration:boom-50, x:{to:-62+48}, scale:{to:0.90}, easing:'sin.in' })
      .then({ duration:125, scale:{to:0.8}, easing:'sin.out' })
      .then({ duration:125, scale:{to:0.85}, easing:'sin.out' })
      .then({ duration:move-200, scale:{to:0.45}, easing:'sin.inOut' })
      .then({ delay:-75, duration:150, x:{to:0}, scale:{to:0.90}, easing:'sin.in' })
      .then({ duration:125, scale:{to:0.8}, easing:'sin.out' })
      .then({ duration:125, scale:{to:0.85}, easing:'sin.out' })
      .then({ duration:125 })
      .then({ duration:350, scale:{to:0}, easing:'sin.out' }),

    ...crtBoom(move, -64, 46),
    ...crtBoom(move*2 + boom, 18, 34),
    ...crtBoom(move*3 + boom*2 - 150, -64, 34),
    ...crtBoom(move*3 + boom*2, 45, 34)
  ]);

  tl.play();
  setInterval(()=>tl.replay(), 4300);
})();
