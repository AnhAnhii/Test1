<!doctype html><html lang="vi"><head><meta charset="utf-8"/>
<title>Neon Heart Pulse</title><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
</style></head><body><canvas id="cv"></canvas>
<script>
const c=document.getElementById('cv'), g=c.getContext('2d');
function R(){c.width=innerWidth*cDPR;c.height=innerHeight*cDPR;g.setTransform(cDPR,0,0,cDPR,0,0)}
const cDPR=Math.min(devicePixelRatio||1,2); addEventListener('resize',R); R();

function H(t,s){ // heart path points
  const x=16*Math.sin(t)**3, y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return [x*s, -y*s];
}
let t0=0;
function draw(ts){
  requestAnimationFrame(draw);
  const w=innerWidth,h=innerHeight, cx=w/2, cy=h/2;
  g.clearRect(0,0,w,h);

  // nhịp đập
  const beat=1+0.06*Math.sin((ts/1000)*2*Math.PI*1.2);
  const s=Math.min(w,h)/30*beat;

  // vệt glow nhiều lớp
  for(let i=8;i>=1;i--){
    g.save(); g.translate(cx,cy);
    g.lineWidth=8+i*2; g.strokeStyle=`hsl(${330+i*3} 95% ${40+i*5}%)`;
    g.shadowBlur=30+i*10; g.shadowColor=`hsl(${330+i*3} 100% 60%)`;
    g.beginPath(); for(let t=-Math.PI;t<=Math.PI;t+=0.01){const [x,y]=H(t,s); t===-Math.PI?g.moveTo(x,y):g.lineTo(x,y)}
    g.stroke(); g.restore();
  }

  // ánh sáng nhấp nháy
  t0+=0.03; const flare=0.5+0.5*Math.sin(t0);
  g.fillStyle=`rgba(255,80,160,${0.08+0.12*flare})`; g.fillRect(0,0,w,h);
}
draw(performance.now());
</script></body></html>
